<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>casual.game</title>
<meta name="description" content="casual.game — 轻松玩，随时玩">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3C4; --ink:#2B2350; --coral:#FF6B6B; --mint:#3DDC97; --sky:#4DA3FF; --grape:#8A5CF6;
  --display:"Baloo 2","Nunito","Arial Rounded MT Bold","PingFang SC",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.2rem;padding:2rem 1rem;overflow:hidden;position:relative;
  background-image:radial-gradient(rgba(43,35,80,.09) 2px,transparent 2px);
  background-size:28px 28px;
}
.logo{display:flex;flex-direction:column;align-items:center;gap:.7rem;z-index:1}
.row{display:flex;gap:clamp(.3rem,1.4vw,.7rem)}
.t{
  --c:var(--coral);
  width:clamp(3.2rem,12vw,7rem);aspect-ratio:1;border:0;cursor:pointer;
  background:var(--c);color:#fff;border-radius:22%;
  font:800 clamp(2.4rem,9.5vw,5.4rem)/1 var(--display);
  box-shadow:0 .5rem 0 var(--ink);border:.22rem solid var(--ink);
  display:grid;place-items:center;padding-bottom:.25em;
  transform:rotate(var(--r,0deg));
  animation:drop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*70ms);
  transition:box-shadow .12s,translate .12s;
}
.t:active{translate:0 .4rem;box-shadow:0 .1rem 0 var(--ink)}
.t:focus-visible{outline:.25rem solid var(--ink);outline-offset:.3rem}
.t.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
.t.dot{background:var(--ink);width:clamp(1.8rem,6vw,3.4rem);align-self:flex-end;box-shadow:none;border-color:var(--ink);cursor:default;aspect-ratio:auto;height:clamp(1.8rem,6vw,3.4rem);border-radius:50%;margin-bottom:.4rem}
@keyframes drop{from{translate:0 -70vh;opacity:0}to{translate:0 0;opacity:1}}
@keyframes hop{0%{translate:0 0}40%{translate:0 -2.2rem;rotate:-8deg}100%{translate:0 0;rotate:0deg}}
.tag{font-size:clamp(1rem,2.6vw,1.3rem);letter-spacing:.12em;z-index:1;animation:fade .8s 1s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blob{position:absolute;border-radius:50%;opacity:.9;border:.2rem solid var(--ink);animation:float 7s ease-in-out infinite alternate}
.b1{width:8rem;height:8rem;background:var(--mint);left:6%;top:12%}
.b2{width:5rem;height:5rem;background:var(--sky);right:9%;top:18%;animation-delay:-2s}
.b3{width:6.5rem;height:6.5rem;background:var(--grape);right:14%;bottom:12%;border-radius:30%;animation-delay:-4s}
.b4{width:3.5rem;height:3.5rem;background:var(--coral);left:12%;bottom:16%;animation-delay:-1s}
@keyframes float{to{translate:0 -1.6rem;rotate:12deg}}
@media (max-width:520px){.b1{width:5rem;height:5rem}.b3{width:4rem;height:4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>

<h1 class="logo" aria-label="casual.game">
  <div class="row" aria-hidden="true" id="r1"></div>
  <div class="row" aria-hidden="true" id="r2"></div>
</h1>
<p class="tag">轻松玩，随时玩</p>

<script>
  const cols=['--coral','--sky','--mint','--grape'];
  const rots=[-4,3,-2,5,-3,2,-5,4,-2,3,-4];
  let i=0;
  function build(id,str){
    const row=document.getElementById(id);
    for(const ch of str){
      const b=document.createElement('button');
      b.className='t';b.textContent=ch;b.type='button';
      b.style.setProperty('--i',i);b.style.setProperty('--r',rots[i%rots.length]+'deg');
      if(ch==='.'){b.className='t dot';b.textContent='';b.tabIndex=-1}
      else{
        b.style.setProperty('--c','var('+cols[i%cols.length]+')');
        b.addEventListener('click',()=>{b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop')});
      }
      row.appendChild(b);i++;
    }
  }
  build('r1','casual');
  build('r2','.game');
</script>
</body>
</html>
